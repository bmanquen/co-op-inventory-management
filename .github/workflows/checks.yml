name: Checks

on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: API tests
        run: bun test tools/
      # Builds the Exact app (a Contract or app.ts error fails here), then runs its tests on a scratch database.
      - name: Build the Exact app
        run: API_BASE_URL=http://127.0.0.1:8081/api scripts/build-web.sh
      # Reads app.config.json and builds the /api routes beside public/, so a broken Expo config fails here, not at deploy.
      - name: Expo export
        run: npx expo export --platform web
      - name: Exact tests
        run: bun exact.mjs test web
