name: Checks

on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Builds the Exact app (a Contract or app.ts error fails here), then runs its tests on a scratch database.
      - name: Build the Exact app
        run: API_BASE_URL=http://127.0.0.1:8081/api scripts/build-web.sh
      - name: Exact tests
        run: bun exact.mjs test web
